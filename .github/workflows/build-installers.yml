name: Build installers

on:
  push:
    branches:
      - feat/window-integration-exe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install

      - name: Build Windows setup exe
        run: bun run build:win-exe

      - name: Commit Windows installer to branch
        shell: bash
        run: |
          mkdir -p releases
          INSTALLER=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "Setup exe not found"
            exit 1
          fi
          cp "$INSTALLER" releases/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/
          if git diff --staged --quiet; then
            echo "Installer unchanged, skipping commit"
            exit 0
          fi
          git commit -m "Add Windows installer for NexttelPOS"
          git push

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NexttelPOS-Windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
