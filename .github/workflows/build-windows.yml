name: Build Windows installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install

      - name: Build Windows setup exe
        run: bun run tauri build --bundles nsis

      - name: Zip installer for delivery
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Setup exe not found in src-tauri/target/release/bundle/nsis"
          }
          Compress-Archive -Path $installer.FullName -DestinationPath "Portal-POS-Windows.zip" -Force
          Write-Host "Created Portal-POS-Windows.zip containing $($installer.Name)"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Portal-POS-Windows
          path: Portal-POS-Windows.zip
