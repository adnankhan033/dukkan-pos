<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Terminal Body Gradient -->
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Receipt Gradient -->
    <linearGradient id="receiptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect x="32" y="32" width="960" height="960" rx="192" fill="none" stroke="url(#brandGrad)" stroke-width="8" stroke-opacity="0.25"/>

  <!-- POS Terminal & Receipt -->
  <g filter="url(#shadow)">
    <!-- Emerging Receipt -->
    <path d="M360 384 L360 210 Q360 190 380 190 L640 190 Q660 190 660 210 L660 384 Z" fill="url(#receiptGrad)"/>
    <line x1="410" y1="250" x2="610" y2="250" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    <line x1="410" y1="290" x2="540" y2="290" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
    <line x1="410" y1="330" x2="580" y2="330" stroke="#06B6D4" stroke-width="10" stroke-linecap="round"/>

    <!-- Terminal Main Base -->
    <rect x="232" y="384" width="560" height="420" rx="48" fill="url(#terminalGrad)" stroke="#475569" stroke-width="6"/>

    <!-- Screen Frame & UI -->
    <rect x="272" y="424" width="480" height="260" rx="28" fill="#020617"/>
    <rect x="292" y="444" width="440" height="220" rx="20" fill="url(#brandGrad)" opacity="0.15"/>
    <path d="M340 510 L440 510 M340 550 L520 550 M340 590 L400 590" stroke="url(#brandGrad)" stroke-width="12" stroke-linecap="round"/>

    <!-- Checkmark Success Badge -->
    <circle cx="630" cy="550" r="44" fill="url(#brandGrad)"/>
    <path d="M610 550 L625 565 L652 535" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Card Slot -->
    <rect x="272" y="720" width="480" height="16" rx="8" fill="#1E293B"/>
  </g>
</svg>
